name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed

  web-tests:
    name: Review page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the page against the generated demo report
        run: node --test tests/web/*.test.mjs

  static-analysis:
    name: Static analysis and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error)
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) { throw 'PSScriptAnalyzer reported findings.' }
      - name: Validate the sample snapshot against the schema
        shell: pwsh
        run: |
          $schema = Get-Content ./schemas/snapshot.schema.json -Raw
          if (-not (Get-Content ./samples/synthetic.snapshot.json -Raw | Test-Json -Schema $schema)) {
            throw 'The sample snapshot does not match schemas/snapshot.schema.json.'
          }

  end-to-end:
    name: Synthetic review end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect, pseudonymize, and report on the synthetic site
        shell: pwsh
        run: |
          $summary = ./scripts/Invoke-CatalogReview.ps1 -Synthetic -Pseudonymize -OutputDirectory ./review
          $summary | Format-List
          $report = Get-Content ./review/report.json -Raw | ConvertFrom-Json
          if ($report.kind -ne 'citrix-catalog-baseline-report' -or -not $report.site.pseudonymized) { throw 'Unexpected report.' }
          if ((Get-Content ./review/site.snapshot.json -Raw) -match 'S-1-5-21|CORP\\') { throw 'Pseudonymized snapshot still contains identities.' }
